<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐕 Flying Dog Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .hero {
      text-align: center;
      z-index: 2;
      position: relative;
    }
    .hero h1 {
      font-size: clamp(2rem, 8vw, 5rem);
      font-weight: 900;
      background: linear-gradient(135deg, #f59e0b, #ef4444, #8b5cf6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      animation: pulse 2s ease-in-out infinite;
    }
    .hero p {
      font-size: 1.2rem;
      color: #888;
      margin-bottom: 2rem;
    }
    .badge {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      border-radius: 999px;
      color: #f59e0b;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .video-container {
      margin: 2rem auto;
      width: 90vw;
      max-width: 700px;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 0 80px rgba(245, 158, 11, 0.2);
      position: relative;
    }
    video, iframe {
      width: 100%;
      aspect-ratio: 16/9;
      display: block;
      border: none;
    }
    /* Floating dog animation */
    .dog {
      position: fixed;
      font-size: 4rem;
      animation: fly 6s ease-in-out infinite;
      z-index: 0;
      pointer-events: none;
    }
    .dog:nth-child(1) { left: 10%; animation-delay: 0s; }
    .dog:nth-child(2) { left: 30%; animation-delay: 1.5s; font-size: 3rem; }
    .dog:nth-child(3) { left: 60%; animation-delay: 3s; font-size: 5rem; }
    .dog:nth-child(4) { left: 80%; animation-delay: 0.8s; font-size: 2.5rem; }
    .dog:nth-child(5) { left: 45%; animation-delay: 2.2s; font-size: 3.5rem; }

    @keyframes fly {
      0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
      10% { opacity: 1; }
      50% { transform: translateY(30vh) rotate(15deg); }
      90% { opacity: 1; }
      100% { transform: translateY(-20vh) rotate(-10deg); opacity: 0; }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }

    .stars {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 0;
      pointer-events: none;
    }
    .star {
      position: absolute;
      width: 3px; height: 3px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s ease-in-out infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; }
      50% { opacity: 1; }
    }

    .footer {
      position: fixed;
      bottom: 1.5rem;
      font-size: 0.8rem;
      color: #555;
      z-index: 2;
    }
    .footer span { color: #f59e0b; }
  </style>
</head>
<body>
  <!-- Stars background -->
  <div class="stars" id="stars"></div>

  <!-- Flying dogs -->
  <div class="dog">🐕</div>
  <div class="dog">🐶</div>
  <div class="dog">🦮</div>
  <div class="dog">🐕‍🦺</div>
  <div class="dog">🐾</div>

  <div class="hero">
    <h1>Flying Dog</h1>
    <p>Sito creato in 30 secondi da un'AI ⚡</p>

    <div class="video-container">
      <video autoplay muted loop playsinline>
        <source src="https://cdn.pixabay.com/video/2020/07/30/45349-445039587_large.mp4" type="video/mp4">
      </video>
    </div>

    <div class="badge">⚙️ Powered by Talos AI</div>
  </div>

  <div class="footer">Built with ❤️ by <span>Talos</span> — in real time</div>

  <script>
    // Generate random stars
    const starsEl = document.getElementById('stars');
    for (let i = 0; i < 80; i++) {
      const star = document.createElement('div');
      star.className = 'star';
      star.style.left = Math.random() * 100 + '%';
      star.style.top = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      star.style.width = star.style.height = (Math.random() * 3 + 1) + 'px';
      starsEl.appendChild(star);
    }
  </script>
</body>
</html>
